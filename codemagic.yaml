
workflows:
  radio_futura_sorso:
    name: Radio Futura Sorso iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Verifica progetto iOS
        script: |
          echo "Controllo dei file del progetto"
          find . -maxdepth 4 -type f | head -80
          echo "Verifica completata"

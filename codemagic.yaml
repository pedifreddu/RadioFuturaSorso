workflows:
  radio_futura_sorso:
    name: Radio Futura Sorso iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Genera progetto Xcode
        script: |
          brew install xcodegen
          cd RadioFuturaSorso-iOS
          xcodegen generate
      - name: Compila app iOS
        script: |
          cd RadioFuturaSorso-iOS
          xcodebuild -project RadioFuturaSorso.xcodeproj \
            -scheme RadioFuturaSorso \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
